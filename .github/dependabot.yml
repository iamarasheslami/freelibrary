version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: scope
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      dagger:
        patterns:
          - "com.google.dagger*"
      square:
        patterns:
          - "com.squareup*"
    ignore:
      # Major upgrades are reviewed and applied by hand.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Kotlin minor upgrades can break kapt, so they are applied by hand as well.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types:
          - "version-update:semver-minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
      include: scope
