version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: scope
    groups:
      gradle-dependencies:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The project deliberately stays on its current toolchain (Android Gradle Plugin 8.13.x,
      # Kotlin 2.1.0 with its matching KSP, Hilt 2.58, compileSdk 36). Newer versions depend on
      # Google Maven access that is restricted for the maintainer, so anything coupled to the
      # toolchain is upgraded by hand, as one deliberate change, when that becomes possible.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "androidx.*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "com.google.dagger*"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "com.google.devtools.ksp"
      - dependency-name: "com.android.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
