name: Dependency graph

# Sends the Gradle dependency graph to GitHub so Dependabot alerts and security updates know every
# library the app and the tools use, including the ones behind other libraries.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-graph
  cancel-in-progress: true

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
