name: Nightly Catalog Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# The workflow's own token only reads this repository. The push to the data repository uses the
# CATALOG_DATA_PAT secret, which only the final push step receives: the build and the sync run without it.
permissions:
  contents: read

# Only one sync may run at a time: two overlapping runs would both push to the data
# repository and the second push would be rejected. A queued run waits for the running one.
concurrency:
  group: nightly-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout freelibrary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout freelibrary-catalog-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iamarasheslami/freelibrary-catalog-data
          path: catalog-data
          # The data repository is public, so it is read without the token, and no credentials stay in its Git config.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Copy current export data into the tool's working directory
        run: |
          mkdir -p catalog-tool/data/export
          cp catalog-data/manifest.json catalog-tool/data/export/manifest.json
          mkdir -p catalog-tool/data/export/books
          cp catalog-data/books/*.json catalog-tool/data/export/books/

      - name: Run nightly sync
        run: ./gradlew :catalog-tool:nightlySync

      # The app trusts these files, so nothing is published unless they are consistent, no book has gone
      # missing compared with what is published now, and no date has gone backwards.
      - name: Validate the updated export data
        run: ./gradlew :catalog-tool:validateExport -PexportArgs="catalog-tool/data/export --previous catalog-data"

      - name: Copy updated export data back into the catalog-data checkout
        run: |
          cp catalog-tool/data/export/manifest.json catalog-data/manifest.json
          cp catalog-tool/data/export/books/*.json catalog-data/books/

      - name: Commit and push if there are changes
        working-directory: catalog-data
        env:
          CATALOG_DATA_PAT: ${{ secrets.CATALOG_DATA_PAT }}
        run: |
          git config user.name "freelibrary-bot"
          git config user.email "actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: nightly catalog sync $(date -u +%Y-%m-%d)"
            # The token is given to Git for these pushes only; nothing is written to the Git config.
            auth=$(printf 'x-access-token:%s' "$CATALOG_DATA_PAT" | base64 -w0)
            echo "::add-mask::$auth"
            # GitHub sometimes answers a push with a short-lived server error: try again a few times before failing.
            for attempt in 1 2 3 4; do
              if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push; then
                exit 0
              fi
              echo "Push failed (attempt $attempt of 4)."
              if [ "$attempt" -lt 4 ]; then
                sleep $((attempt * 30))
              fi
            done
            exit 1
          fi
