name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Dependabot pull requests run with a read-only token unless the workflow asks for more.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Merge safe dependency updates
    # Only Dependabot's own pull requests, never a pull request from anyone else.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read what Dependabot changed
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge only queues the merge: GitHub completes it once every required check (build, tests,
      # lint, PR title) has passed. A failing update therefore stays open, and nothing broken reaches main.
      - name: Queue a squash merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ask for a human look at major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "This is a major update, so it is not merged automatically. Read the release notes, then merge it yourself or close it with \`@dependabot ignore this major version\`."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
