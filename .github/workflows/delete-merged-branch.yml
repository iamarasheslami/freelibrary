name: Delete merged branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete merged head branch
    # Pull requests merged by auto-merge leave their branch behind, so delete it
    # here. Only same-repository branches are touched, and never main.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the head branch
        run: |
          if ! out=$(gh api --method DELETE "repos/$REPO/git/refs/heads/$BRANCH" 2>&1); then
            if echo "$out" | grep -q "Reference does not exist"; then
              echo "Branch $BRANCH was already deleted."
            else
              echo "$out"
              exit 1
            fi
          fi
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
